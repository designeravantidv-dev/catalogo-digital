<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogo Digital</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8eaed;color:#222;font:15px Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}header{padding:12px 20px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:17px;margin:0}main{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:18px 8px}#book{margin:auto}.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:14px;background:#fff}button{border:0;background:#252525;color:white;border-radius:7px;padding:10px 15px;cursor:pointer}button:hover{background:#444}#status{min-width:95px;text-align:center}.hint{font-size:12px;color:#666;text-align:center;padding:0 10px 12px;background:#fff}
</style>
</head>
<body>
<header><h1>Catalogo Digital</h1><span>Arraste o canto da pagina para virar</span></header>
<main id="stage"><div id="book"></div></main>
<div class="controls"><button id="prev">Anterior</button><span id="status">Pagina 1</span><button id="next">Proxima</button><button id="zoom">Ampliar</button><button id="full">Tela cheia</button></div>
<div class="hint">No celular, deslize para navegar. Clique na pagina para ampliar.</div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function(){
var images=["paginas/pagina-0001.jpg","paginas/pagina-0002.jpg","paginas/pagina-0003.jpg","paginas/pagina-0004.jpg","paginas/pagina-0005.jpg","paginas/pagina-0006.jpg","paginas/pagina-0007.jpg","paginas/pagina-0008.jpg","paginas/pagina-0009.jpg","paginas/pagina-0010.jpg","paginas/pagina-0011.jpg","paginas/pagina-0012.jpg","paginas/pagina-0013.jpg","paginas/pagina-0014.jpg","paginas/pagina-0015.jpg","paginas/pagina-0016.jpg","paginas/pagina-0017.jpg","paginas/pagina-0018.jpg","paginas/pagina-0019.jpg","paginas/pagina-0020.jpg"];
var stage=document.getElementById("stage"),book=document.getElementById("book"),status=document.getElementById("status");
if(!window.St||!St.PageFlip){status.textContent="Erro ao carregar biblioteca";return;}
var flip=new St.PageFlip(book,{width:420,height:260,size:"stretch",minWidth:180,maxWidth:420,minHeight:Math.round(180*260/420),maxHeight:260,showCover:true,drawShadow:true,maxShadowOpacity:0.5,flippingTime:850,useMouseEvents:true,mobileScrollSupport:false,autoSize:true});
flip.loadFromImages(images);
function update(){status.textContent="Pagina "+(flip.getCurrentPageIndex()+1)+" / "+images.length;}
flip.on("flip",update);update();
document.getElementById("prev").onclick=function(){flip.flipPrev();};
document.getElementById("next").onclick=function(){flip.flipNext();};
var enlarged=false;document.getElementById("zoom").onclick=function(){enlarged=!enlarged;stage.style.overflow=enlarged?"auto":"hidden";book.style.transform=enlarged?"scale(1.3)":"";book.style.transformOrigin="center center";this.textContent=enlarged?"Reduzir":"Ampliar";};
document.getElementById("full").onclick=function(){if(!document.fullscreenElement&&document.documentElement.requestFullscreen){document.documentElement.requestFullscreen();}else if(document.exitFullscreen){document.exitFullscreen();}};
})();
</script>
</body>
</html>
